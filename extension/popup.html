<!DOCTYPE html>
<html>
<head>
    <title>C-Lock</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
    width: 340px;
    margin: 0;
    color: #fff;
    padding: 0;
    background: #050505; 
    overflow: hidden;
    border-radius: 32px;
}
        body {
            font-family: Arial, sans-serif;
        }

        .popup {
    width: 340px;
    min-height: 470px;
    padding: 22px;
    border-radius: 32px;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 20%, rgba(255, 214, 41, 0.18), transparent 25%),
        radial-gradient(circle at 0% 45%, rgba(255, 109, 41, 0.35), transparent 38%),
        linear-gradient(145deg, #1b120b, #050505 75%);

    border: 1px solid rgba(255, 150, 30, 0.55);

    box-shadow:
        inset 0 0 45px rgba(255, 109, 41, 0.18);
}

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .shield {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: rgba(255, 109, 41, 0.15);
            border: 1px solid #ff8a1d;
            color: #ffb21d;
            box-shadow: 0 0 16px rgba(255, 109, 41, 0.8);
        }

        .arc {
            width: 230px;
            height: 115px;
            margin: 0 auto -8px;
            border-top: 18px solid rgba(255, 151, 28, 0.55);
            border-left: 18px solid rgba(255, 151, 28, 0.35);
            border-right: 18px solid rgba(255, 151, 28, 0.35);
            border-radius: 160px 160px 0 0;
            position: relative;
            filter: drop-shadow(0 0 14px rgba(255, 173, 25, 0.75));
            animation: glowPulse 2.4s ease-in-out infinite;
        }

        .arc::after {
            content: "";
            position: absolute;
            top: -18px;
            right: 28px;
            width: 72px;
            height: 18px;
            border-radius: 30px;
            background: #ffd629;
            box-shadow: 0 0 20px #ffd629;
        }

        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.85;
            }
            50% {
                opacity: 1;
            }
        }

        .subtitle {
            text-align: center;
            color: #bababa;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        h2 {
            margin: 0 0 6px;
            text-align: center;
            font-size: 25px;
        }

        .small {
            text-align: center;
            color: #bababa;
            margin-bottom: 18px;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 12px;
        }

        .input-wrap span {
            position: absolute;
            left: 14px;
            top: 12px;
            color: #ff9b28;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border-radius: 14px;
            border: 1px solid rgba(255, 151, 28, 0.45);
            background: rgba(22, 19, 17, 0.72);
            color: #fff;
            outline: none;
            font-size: 14px;
            box-shadow: inset 0 0 14px rgba(255, 109, 41, 0.08);
        }

        input:focus {
            border-color: #ffd629;
            box-shadow: 0 0 16px rgba(255, 214, 41, 0.28);
        }

        input::placeholder {
            color: #8f8278;
        }

        #loginBtn {
            width: 151px;
            height: 54px;
            border-radius: 20px;
            border: none;
            display: block;
            margin: 20px auto 14px;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            background: radial-gradient(circle at 35% 30%, #ffd629, #ff8b19 60%, #b54a08);
            box-shadow:
                0 0 22px rgba(255, 214, 41, 0.8),
                0 0 45px rgba(255, 109, 41, 0.55);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        #loginBtn:hover {
            transform: scale(1.06);
            box-shadow:
                0 0 28px rgba(255, 214, 41, 1),
                0 0 60px rgba(255, 109, 41, 0.75);
        }

        #loginBtn:active {
            transform: scale(0.94);
        }

        .error {
            color: #ff6d29;
            font-size: 12px;
            text-align: center;
            min-height: 16px;
        }

        .muted {
            color: #bababa;
            font-size: 12px;
            text-align: center;
        }

        #sessionBox {
            text-align: center;
            animation: popIn 350ms ease-out;
        }

        #userEmail {
            display: block;
            color: #ffd629;
            margin: 10px 0;
            word-break: break-all;
        }

        #logoutBtn {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 151, 28, 0.6);
            background: rgba(255, 109, 41, 0.12);
            color: #ff9b28;
            cursor: pointer;
            font-weight: 700;
        }

        #logoutBtn:hover {
            background: rgba(255, 109, 41, 0.25);
        }
    </style>
</head>
<body>
    <div class="popup">
        <div class="brand">
            <div class="shield"></div>
            <div>C-LOCK</div>
        </div>

        <div id="loginBox">
            <div class="arc"></div>

            <div class="subtitle">SECURE. SIMPLE. SMART.</div>
            <h2>Welcome Back</h2>
            <div class="small">Sign in to your account</div>

            <div class="input-wrap">
                <span></span>
                <input id="email" type="email" placeholder="Email address">
            </div>

            <div class="input-wrap">
                <span></span>
                <input id="password" type="password" placeholder="Password">
            </div>

            <button id="loginBtn">Login</button>

            <div id="error" class="error"></div>
        </div>

        <div id="sessionBox" style="display:none;">
            <div class="arc"></div>
            <h2>Unlocked</h2>
            <p class="muted">Logged in as</p>
            <strong id="userEmail"></strong>
            <p class="muted">Session stays active while you use C-Lock.</p>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
