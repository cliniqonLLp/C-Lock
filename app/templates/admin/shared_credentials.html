<!DOCTYPE html>
<html>
<head>
    <title>Shared Credentials - C-Lock Admin</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #e8dfd4;
            padding: 28px;
            color: #171717;
        }

        .page {
            max-width: 1200px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 40px;
            margin: 0;
        }

        .back {
            text-decoration: none;
            background: #cde4db;
            padding: 12px 18px;
            border-radius: 999px;
            font-weight: 700;
            color: #1c403b;
            box-shadow: 8px 10px 20px rgba(80, 70, 60, 0.14);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .card {
            position: relative;
            border-radius: 28px;
            padding: 26px;
            overflow: hidden;
            background: rgba(255, 250, 242, 0);
            box-shadow:
                14px 18px 35px rgba(90, 70, 45, 0.18),
                inset 0 0 25px rgba(255,255,255,0.75);
        }

        .card::before {
            content: "";
            position: absolute;
            right: -50px;
            bottom: -70px;
            width: 220px;
            height: 170px;
            /* background: linear-gradient(135deg, #cde4db, #eef8f1); */
            border-radius: 55% 45% 0 0;
            transform: rotate(-10deg);
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: none;
            border-radius: 18px;
            background: rgba(255,255,255,0.82);
            box-shadow:
                inset 0 0 14px rgba(255,255,255,0.8),
                6px 8px 18px rgba(90, 70, 45, 0.12);
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 20px;
            background: #b5d9d4;
            color: #1c403b;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 8px 10px 22px rgba(80, 70, 60, 0.16);
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .table-card {
            grid-column: span 2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(255,255,255,0.55);
        }

        th {
            text-align: left;
            padding: 14px;
            background: rgba(205, 228, 219, 0.85);
            font-size: 13px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid rgba(120,110,100,0.15);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 999px;
            background: #dcebe7;
            font-size: 12px;
            font-weight: bold;
        }

    </style>
</head>
<body>

<div class="page">

    <div class="top">
        <h1>Shared Credentials</h1>
        <a class="back" href="/admin-panel">← Back</a>
    </div>

    <div class="grid">

        <!-- Create -->
        <div class="card">
            <h2>Create Shared Credential</h2>

            <form method="post" action="/admin-panel/shared-credentials/create">
                <input type="text" name="label" placeholder="Label" required>
                <input type="text" name="domains" placeholder="Domains (comma separated)" required>
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>

                <button>Create Credential</button>
            </form>
        </div>

        <!-- Assign -->
        <div class="card">
            <h2>Assign Credential</h2>

            <form method="post" action="/admin-panel/shared-credentials/assign">

                <select name="shared_credential_id" required>
                    {% for cred in shared_credentials %}
                        <option value="{{ cred.id }}">{{ cred.label }}</option>
                    {% endfor %}
                </select>

                <select name="user_id" required>
                    {% for user in users %}
                        <option value="{{ user.id }}">{{ user.email }}</option>
                    {% endfor %}
                </select>

                <select name="access_type">
                    <option value="use">Use</option>
                    <option value="owner">Owner</option>
                </select>

                <button>Assign Access</button>
            </form>
        </div>

        <!-- Table -->
        <div class="card table-card">
            <h2>Existing Shared Credentials</h2>

            <table>
                <tr>
                    <th>ID</th>
                    <th>Label</th>
                    <th>Status</th>
                    <th>Created By</th>
                </tr>

                {% for cred in shared_credentials %}
                <tr>
                    <td>{{ cred.id }}</td>
                    <td>{{ cred.label }}</td>
                    <td><span class="badge">{{ cred.status }}</span></td>
                    <td>{{ cred.created_by_user_id }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>

    </div>
</div>

</body>
</html>
