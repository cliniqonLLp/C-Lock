<!DOCTYPE html>
<html>
<head>
    <title>Shared Credentials - C-Lock Admin</title>
</head>
<body>
    <h1>Shared Credentials</h1>

    <a href="/admin-panel">Back</a>

    <h2>Create Shared Credential</h2>

    <form method="post" action="/admin-panel/shared-credentials/create">
        <input type="text" name="label" placeholder="Label e.g. Clinix Shared Login" required>
        <br><br>

        <input type="text" name="domains" placeholder="Domains comma separated e.g. clinix.cliniqon.com" required>
        <br><br>

        <input type="text" name="username" placeholder="Login username" required>
        <br><br>

        <input type="password" name="password" placeholder="Login password" required>
        <br><br>

        <button type="submit">Create Shared Credential</button>
    </form>

    <h2>Assign Shared Credential</h2>

    <form method="post" action="/admin-panel/shared-credentials/assign">
        <label>Shared Credential</label><br>
        <select name="shared_credential_id" required>
            {% for cred in shared_credentials %}
                <option value="{{ cred.id }}">{{ cred.id }} - {{ cred.label }}</option>
            {% endfor %}
        </select>
        <br><br>

        <label>User</label><br>
        <select name="user_id" required>
            {% for user in users %}
                <option value="{{ user.id }}">{{ user.id }} - {{ user.email }}</option>
            {% endfor %}
        </select>
        <br><br>

        <select name="access_type">
            <option value="use">Use</option>
            <option value="owner">Owner</option>
        </select>
        <br><br>

        <button type="submit">Assign Access</button>
    </form>

    <h2>Existing Shared Credentials</h2>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Label</th>
            <th>Status</th>
            <th>Created By</th>
        </tr>

        {% for cred in shared_credentials %}
        <tr>
            <td>{{ cred.id }}</td>
            <td>{{ cred.label }}</td>
            <td>{{ cred.status }}</td>
            <td>{{ cred.created_by_user_id }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
