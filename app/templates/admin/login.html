<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - C-Lock</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at 25% 20%, #041442, transparent 28%), linear-gradient(135deg, #3564bd, #24418a);
        }

        .login-card {
                width: 390px;
    padding: 28px;
    border-radius: 34px;
    background: rgba(180, 205, 245, 0.32);
    border: 2px solid rgb(249 249 249 / 65%);
    box-shadow: 0 25px 50px rgb(209 209 209 / 35%), inset 0 0 30px rgb(255 255 255 / 35%);
    backdrop-filter: blur(18px);
    animation: popIn .45s ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(.92) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .logo-box {
            width: 86px;
            height: 86px;
            margin: 0 auto 18px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #f4fbff, #6d8fc9);
            border: 2px solid rgba(255,255,255,.8);
            box-shadow:
                inset 0 0 16px rgba(255,255,255,.9),
                0 12px 25px rgba(22, 50, 95, .35);
            font-size: 36px;
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #07101f;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .sub {
            text-align: center;
            color: #273a62;
            margin: 8px 0 24px;
            font-size: 14px;
        }

        .input-wrap {
            margin-bottom: 16px;
            border-radius: 22px;
            padding: 3px;
            background: linear-gradient(145deg, rgba(255,255,255,.9), rgba(55,80,130,.45));
            box-shadow: 0 10px 18px rgba(20, 45, 90, .22);
        }

        input {
            width: 100%;
            border: none;
            outline: none;
            padding: 16px 18px;
            border-radius: 20px;
            font-size: 15px;
            color: #07101f;
            background: linear-gradient(145deg, #ecf6ff, #a7bce2);
            box-shadow: inset 0 0 12px rgba(255,255,255,.75);
        }

        input::placeholder {
            color: #3d4f77;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 16px;
            border: solid 1px white;
            border-radius: 24px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 800;
            color: white;
            background: linear-gradient(145deg, #061021, #1c315e);
            box-shadow:
                inset 0 0 12px rgba(255,255,255,.25),
                0 15px 28px rgba(5, 20, 55, .38);
            transition: .2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow:
                inset 0 0 14px rgba(255,255,255,.35),
                0 20px 34px rgba(5, 20, 55, .48);
        }

        .quick-icons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 22px;
        }

        .icon {
            height: 56px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #f5fbff, #7f9ed3);
            box-shadow:
                inset 0 0 12px rgba(255,255,255,.85),
                0 10px 18px rgba(22, 50, 95, .28);
            font-size: 22px;
        }

        .icon.dark {
            background: linear-gradient(145deg, #38486b, #060914);
            color: white;
        }

        .error {
            color: #9b1025;
            text-align: center;
            margin-top: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box"></div>

        <h1>C-Lock Admin</h1>
        <div class="sub">Secure control panel access</div>

        <form method="post" action="/admin-login">
            <div class="input-wrap">
                <input type="email" name="email" placeholder="Email" required>
            </div>

            <div class="input-wrap">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit">LOGIN</button>
        </form>

        

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
