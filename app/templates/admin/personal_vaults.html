<!DOCTYPE html>
<html>
<head>
    <title>Personal Vaults - C-Lock Admin</title>
</head>
<body>
    <h1>Personal Vaults</h1>

    <a href="/admin-panel">Back</a>

    <h2>Add Personal Credential to User</h2>

    <form method="post" action="/admin-panel/personal-vaults/add">
        <label>User</label><br>
        <select name="user_id" required>
            {% for user in users %}
                <option value="{{ user.id }}">{{ user.id }} - {{ user.email }}</option>
            {% endfor %}
        </select>
        <br><br>

        <input type="text" name="label" placeholder="Label e.g. Pinterest" required>
        <br><br>

        <input type="text" name="domains" placeholder="Domains comma separated e.g. in.pinterest.com,pinterest.com" required>
        <br><br>

        <input type="text" name="username" placeholder="Login username" required>
        <br><br>

        <input type="password" name="password" placeholder="Login password" required>
        <br><br>

        <button type="submit">Add Credential</button>
    </form>
</body>
</html>
